name: OTServer Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # Corrigido: agora roda a cada 5 minutos (limite mínimo do GitHub)
  workflow_dispatch:

# Permite que o bot do GitHub faça commit e push no seu repositório
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python monitor.py

      - name: Commit level changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_levels.json
          # O 'exit 0' garante que o workflow não marque como "falha" se não houver mudanças
          git commit -m "Update player levels" || exit 0
          git push
